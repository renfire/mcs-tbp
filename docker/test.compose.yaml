# Test environment: the PHPUnit image plus the databases used by the integration tests (PostgreSQL 17 and
# MariaDB 11.8 for the MySQL connector). Run through bin/test.

name: tbp-test

services:
  tests:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: tbp-test:php${PHP_VERSION:-8.5}
    environment:
      TBP_TEST_PGSQL_SERVER: postgres
      TBP_TEST_PGSQL_DATABASE: tbp
      TBP_TEST_PGSQL_USERNAME: tbp
      TBP_TEST_PGSQL_PASSWORD: tbp
      TBP_TEST_MYSQL_SERVER: mariadb
      TBP_TEST_MYSQL_DATABASE: tbp
      TBP_TEST_MYSQL_USERNAME: tbp
      TBP_TEST_MYSQL_PASSWORD: tbp
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tbp
      POSTGRES_USER: tbp
      POSTGRES_PASSWORD: tbp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tbp", "-d", "tbp"]
      interval: 1s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: tbp
      MARIADB_USER: tbp
      MARIADB_PASSWORD: tbp
      MARIADB_ROOT_PASSWORD: tbp-root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 1s
      timeout: 3s
      retries: 60
