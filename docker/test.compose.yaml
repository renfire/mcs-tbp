# Test environment: the PHPUnit image plus the databases used by the integration tests. Run through bin/test.

name: tbp-test

services:
  tests:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: tbp-test:php${PHP_VERSION:-8.5}
    environment:
      TBP_TEST_PGSQL_SERVER: postgres
      TBP_TEST_PGSQL_DATABASE: tbp
      TBP_TEST_PGSQL_USERNAME: tbp
      TBP_TEST_PGSQL_PASSWORD: tbp
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tbp
      POSTGRES_USER: tbp
      POSTGRES_PASSWORD: tbp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tbp", "-d", "tbp"]
      interval: 1s
      timeout: 3s
      retries: 30
